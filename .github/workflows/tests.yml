name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_password
          POSTGRES_DB: test_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user -d test_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ai_user:ai_password@localhost:5432/test_database
      DATABASE_URL: postgresql+psycopg://ai_user:ai_password@localhost:5432/test_database
      JWT_SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      OLLAMA_URL: http://localhost:11434
      MODEL_NAME: qwen3:1.7b
      EMBEDDING_MODEL: nomic-embed-text
      MAX_HISTORY_MESSAGES: "20"
      RECENT_MESSAGES: "10"
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
